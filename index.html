  <script>
    const codeEl = document.querySelector('#code');
    const btn = document.querySelector('#btn');
    const result = document.querySelector('#result');

    function show(data) {
      result.style.display = 'block';
      if (!data) {
        result.className = 'result err';
        result.innerHTML = '<div style="color:#FF0000">❌ ไม่พบรหัสนี้ในระบบ</div>';
        return;
      }
      result.className = 'result ok';
      const shopName = data.Name ?? '-';
      const chance = data.chance ?? 0;
      result.innerHTML = `
        <div class="field"><span class="label">ชื่อร้าน</span><span class="value">${shopName}</span></div>
        <div class="field"><span class="label">จำนวนสิทธิ์จับฉลาก</span><span class="value">${Number(chance).toLocaleString('th-TH')}</span></div>
      `;
    }

    function lookup() {
      const code = String(codeEl.value || '').trim().toUpperCase();
      if (!code) { show(null); return; }
      const rec = index.get(code);
      show(rec || null);
    }

    btn.addEventListener('click', lookup);
    codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });
  </script>
